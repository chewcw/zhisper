name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-native
            executable: zhisper
            archive: zhisper-linux-x86_64.tar.gz
            archive_format: tar
          - target: x86_64-windows
            executable: zhisper.exe
            archive: zhisper-windows-x86_64.zip
            archive_format: zip

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libasound2-dev libudev-dev libevdev-dev

      - name: Build release executable
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Stage executable
        shell: bash
        run: |
          test -f "zig-out/bin/${{ matrix.executable }}"
          mkdir -p package
          cp "zig-out/bin/${{ matrix.executable }}" "package/${{ matrix.executable }}"

      - name: Create tar archive
        if: matrix.archive_format == 'tar'
        run: tar -C package -czf "${{ matrix.archive }}" "${{ matrix.executable }}"

      - name: Create zip archive
        if: matrix.archive_format == 'zip'
        run: zip -j "${{ matrix.archive }}" "package/${{ matrix.executable }}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: zhisper-*
          path: dist
          merge-multiple: true

      - name: Verify release archives
        shell: bash
        run: |
          test -f dist/zhisper-linux-x86_64.tar.gz
          test -f dist/zhisper-windows-x86_64.zip

      - name: Generate checksums
        working-directory: dist
        run: sha256sum zhisper-linux-x86_64.tar.gz zhisper-windows-x86_64.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Binary release for zhisper $GITHUB_REF_NAME." \
            dist/zhisper-linux-x86_64.tar.gz \
            dist/zhisper-windows-x86_64.zip \
            dist/SHA256SUMS
