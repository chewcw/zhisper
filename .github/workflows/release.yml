name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build Linux executable
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libasound2-dev libudev-dev libevdev-dev

      - name: Build release executable
        run: zig build -Dtarget=x86_64-native -Doptimize=ReleaseSafe

      - name: Stage executable
        shell: bash
        run: |
          test -f "zig-out/bin/zhisper"
          mkdir -p package
          cp "zig-out/bin/zhisper" "package/zhisper"

      - name: Create tar archive
        run: tar -C package -czf zhisper-linux-x86_64.tar.gz zhisper

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: zhisper-linux-x86_64.tar.gz
          path: zhisper-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: zhisper-*
          path: dist
          merge-multiple: true

      - name: Verify release archives
        shell: bash
        run: |
          test -f dist/zhisper-linux-x86_64.tar.gz

      - name: Generate checksums
        working-directory: dist
        run: sha256sum zhisper-linux-x86_64.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Binary release for zhisper $GITHUB_REF_NAME." \
            dist/zhisper-linux-x86_64.tar.gz \
            dist/SHA256SUMS
