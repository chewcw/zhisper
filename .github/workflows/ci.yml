name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        run: zig fmt --check .

  linux:
    name: Linux build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libasound2-dev libudev-dev libevdev-dev
      - name: Cache Zig packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            zig-pkg
          key: zig-pkgs-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-pkgs-${{ runner.os }}-
      - name: Fetch dependencies (with retry)
        run: |
          for i in 1 2 3 4 5; do
            zig build --fetch && break
            echo "fetch attempt $i failed, retrying in 15s..."
            sleep 15
            if [ "$i" -eq 5 ]; then exit 1; fi
          done
      - name: Build
        run: zig build
      - name: Run tests
        run: zig build test

