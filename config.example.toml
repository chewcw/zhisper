# zhisper example config — copy to OS config dir and edit.
# Linux: ~/.config/zhisper/config.toml
# Windows: %APPDATA%/zhisper/config.toml
# macOS: ~/Library/Application Support/zhisper/config.toml
# Secrets are NEVER set here (api_key in this file is a hard error); use env vars.

[transcribe]
provider = "groq" # groq | openai | custom
model = ""        # empty = preset default
base_url = ""     # empty = preset default; required if provider=custom
prompt = ""

# Key codes are OS-native and are NOT interchangeable between platforms.
#           Linux  macOS  Windows
#   A        30     0      0x41
#   C        46     8      0x43
#   F9       67     0x78   0x78
#   F11      87     0x6A   0x7A
#   Return   28     36     0x0D
#   Tab      15     48     0x09
# Use -1 to disable a key. 0 is a real key (macOS 'A'), not "disabled".
[hotkey]
key_code = 67     # OS-native; -1 disables. Linux KEY_F9=67 / macOS kVK_F9=0x78 / Windows VK_F9=0x78
mode = "hold"     # hold | toggle
cancel_key_code = 46  # OS-native; -1 disables. Linux KEY_C=46 / macOS kVK_C=8 / Windows VK_C=0x43
clipboard_key_code = -1  # OS-native; -1 or absent = off. Linux KEY_F11=87 / macOS kVK_F11=0x6A /
                        # Windows VK_F11=0x7A. A recording started with this key puts the
                        # transcript in the clipboard instead of typing it anywhere.
evdev = ""        # Linux only, explicit /dev/input/eventN (empty = off, wins over evdev_name)
evdev_name = ""   # Linux only, device name match e.g. "kanata" (empty = off, wins over auto-scan)

[audio]
device = ""       # empty = system default mic

[normalize]
# Optional second API call that rewrites the transcript into clean written
# text: resolves self-corrections, normalizes spoken numbers/dates/emails,
# and fixes punctuation. Costs one extra network round trip, so it is off by
# default. This section is watched at runtime: editing `enabled` here takes
# effect within a second, no restart needed. No new key — it reuses
# GROQ_API_KEY / ZHISPER_API_KEY.
enabled = false
model = ""        # empty = preset default (openai/gpt-oss-20b)
base_url = ""     # empty = preset default; set to point at any OpenAI-compatible
                  # chat completions endpoint (self-hosted, proxy, or a future
                  # provider) without recompiling.
# The three axes below are closed sets. Values outside them degrade output,
# because the prompt format was only trained on these combinations.
styling = "semi-formal"  # casual | semi-casual | semi-formal | formal
structure = "prose"      # prose | lists
context = "general"      # general | email

[daemon]
min_duration_ms = 500
wav_path = ""   # "" = platform temp directory. Set an explicit path to override.
trailing_newline = "strip"  # "strip" drops newlines the transcript ends with; "send" keeps them
type_delay_ms = 0           # 0 = platform default (macOS 2ms, Windows 0)
keep_wav_on_error = true
overlay = true     # false = no floating status pill (tray state unaffected)
tray = false
notify = "errors,clipboard"  # "off" | "errors" | "clipboard" | "errors,clipboard"
verbose = false    # true also logs one metadata line per API call (model, payload sizes, status, latency, upstream error on failure). Never logs keys, audio, or transcripts.
